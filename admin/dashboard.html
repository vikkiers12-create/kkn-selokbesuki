<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Admin — Desa SelokBesuki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body class="admin-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">🌾</div>
      <div>
        <span class="sb-title">Desa SelokBesuki</span>
        <span class="sb-sub">Panel Admin</span>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-section-label">Menu Utama</div>
      <a href="#dashboard" class="sb-link active" data-page="dashboard">
        <span class="sb-icon">📊</span> Dashboard
      </a>
      <a href="#profil" class="sb-link" data-page="profil">
        <span class="sb-icon">🏡</span> Profil Desa
      </a>
      <a href="#sejarah" class="sb-link" data-page="sejarah">
        <span class="sb-icon">📜</span> Sejarah
      </a>
      <a href="#aset" class="sb-link" data-page="aset">
        <span class="sb-icon">🏛️</span> Aset Desa
      </a>
      <a href="#umkm" class="sb-link" data-page="umkm">
        <span class="sb-icon">🛒</span> UMKM
      </a>

      <div class="sb-section-label" style="margin-top:1rem">Komunikasi</div>
      <a href="#pesan" class="sb-link" data-page="pesan">
        <span class="sb-icon">✉️</span> Pesan Masuk
        <span class="sb-badge" id="unreadBadge"></span>
      </a>
      <a href="#log" class="sb-link" data-page="log">
        <span class="sb-icon">🕐</span> Log Aktivitas
      </a>

      <div class="sb-section-label" style="margin-top:1rem">Akun</div>
      <a href="#setelan" class="sb-link" data-page="setelan">
        <span class="sb-icon">⚙️</span> Pengaturan
      </a>
    </nav>

    <div class="sb-footer">
      <a href="../index.html" target="_blank" class="sb-publik-btn">🌐 Lihat Web Publik</a>
      <button class="sb-logout" id="logoutBtn">🚪 Keluar</button>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <span class="topbar-time" id="topbarTime"></span>
        <div class="topbar-user" id="topbarUser">👤 Admin</div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content" id="pageContent">
      <!-- Rendered by JS -->
    </main>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn btn-secondary" id="modalCancelBtn">Batal</button>
        <button class="btn btn-primary" id="modalSaveBtn">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Confirm dialog -->
  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal confirm-modal">
      <div class="confirm-icon">⚠️</div>
      <h3 id="confirmTitle">Konfirmasi</h3>
      <p id="confirmMsg"></p>
      <div class="modal-footer" style="justify-content:center">
        <button class="btn btn-secondary" id="confirmNo">Batal</button>
        <button class="btn btn-danger" id="confirmYes">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script src="../shared-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
